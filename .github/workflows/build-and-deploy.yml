on:
  push:
    branches:
      - develop
      - preview
      - live
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Ren'Py 8.5.3
        uses: PaxlavaGames/renpy-install@v0.3.0
        with:
          version: "8.5.3"
          download_web: "yes"
      - name: Install Butler
        run: |
          wget https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -O butler.zip
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          butler --version
      - name: Build
        run: |
          #!/usr/bin/env bash          
          
          cp -a renpy renpy_local
          chmod -R u+w renpy_local
          
          # Enter writable SDK
          cd renpy_local
              
          # Setup some export vars for lack of better placement
          export butler_user_slash_game="${{ secrets.BUTLER_USER_SLASH_GAME }}"          
          
          # setup Butler
          export BUTLER_API_KEY=${{ secrets.BUTLER_API_KEY }}
          echo "Checking Butler version..."
          butler --version

          mkdir -p builds

          # build the project
          ./renpy.sh launcher distribute ../${{ github.event.repository.name }}/ --destination builds

          # build for Web PWA
          #./renpy.sh launcher web_build_cli ../${{github.event.repository.name}}/ --destination ${{github.event.repository.name}}_web

          ## push the builds to Itch

          # Step into the generated dir to find the web.zip for Butler
          #cd *-dists
          #butler push *.zip ${butler_user_slash_game}:web-${GITHUB_REF_NAME}

          # Step into the builds dir for the rest of the builds.
          cd builds
          
          # Push to itch for various build types.

          butler push *-win.zip ${butler_user_slash_game}:windows-${GITHUB_REF_NAME}
          butler push *-pc.zip ${butler_user_slash_game}:linux-${GITHUB_REF_NAME}
          butler push *-mac.zip ${butler_user_slash_game}:mac-${GITHUB_REF_NAME}
          
